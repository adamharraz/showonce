services:
  - type: web
    name: showonce
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STORAGE_MODE
        value: local
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_REQUIRE_ACCESS_CODE
        value: "false"
      - key: ALLOW_LOCAL_LOGIN
        value: "false"
      - key: TWIN_ENABLED
        value: "false"
      - key: LIVE_COACH_ENABLED
        value: "true"
      - key: FREE_TIER_CONFIRMED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
